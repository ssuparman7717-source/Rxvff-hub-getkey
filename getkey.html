<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Rxvff Hub — Key System</title>
  <style>
    :root {
      --bg: #0d0f14;
      --surface: #13161e;
      --surface-elev: #1a1e29;
      --border: #2a3042;
      --accent: #6366f1;
      --accent-hover: #7679ff;
      --success: #22c55e;
      --danger: #ef4444;
      --text: #f4f6fb;
      --muted: #949db2;
      --dim: #60697e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.14), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(56, 189, 248, 0.1), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    .top-bar {
      height: 3px;
      background: linear-gradient(90deg, #6366f1, #a855f7, #38bdf8);
    }

    .body {
      padding: 26px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--accent-hover);
      background: var(--surface-elev);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .sub {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .step-box {
      background: var(--surface-elev);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .step-note {
      font-size: 12px;
      color: var(--dim);
      line-height: 1.45;
    }

    .btn-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 44px;
      border-radius: 10px;
      background: var(--accent);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.16s ease;
    }

    .btn-link:hover {
      background: var(--accent-hover);
    }

    .status {
      margin-top: 12px;
      font-size: 12px;
      color: var(--dim);
      min-height: 16px;
    }

    .status.ok {
      color: var(--success);
    }

    .status.err {
      color: var(--danger);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="top-bar"></div>
    <div class="body">
      <span class="badge">RXVFF // ANTI-BYPASS</span>
      <h1>Get Your Access Key</h1>
      <p class="sub">Complete the Linkvertise checkpoint to receive your Rxvff Hub key.</p>

      <div class="step-box">
        <div class="step-header">
          <span>Checkpoint</span>
          <span>Shield Active</span>
        </div>
        <p class="step-note">Direct callback skips and tamper attempts are blocked. Launch through the checkpoint button.</p>
      </div>

      <a id="lvBtn" class="btn-link" href="#" rel="noopener noreferrer">
        Continue to Linkvertise
      </a>

      <div class="status" id="statusText">Initializing guard...</div>
    </div>
  </main>

  <script>
    const LINKVERTISE_URL = "https://linkvertise.com/your-link-here";
    const lvBtn = document.getElementById("lvBtn");
    const statusText = document.getElementById("statusText");

    let tripped = false;

    function tripBypass(reason) {
      if (tripped) return;
      tripped = true;
      sessionStorage.removeItem("rxvff_lv_nonce");
      localStorage.removeItem("rxvff_lv_started");
      lvBtn.removeAttribute("href");
      lvBtn.style.pointerEvents = "none";
      lvBtn.style.opacity = "0.45";
      statusText.className = "status err";
      statusText.textContent = "Bypass detected (" + reason + "). Session invalidated.";
    }

    function makeNonce() {
      const arr = new Uint8Array(12);
      crypto.getRandomValues(arr);
      return Array.from(arr, (b) => b.toString(16).padStart(2, "0")).join("");
    }

    const params = new URLSearchParams(window.location.search);
    const returnedToken = params.get("token");
    const expectedNonce = sessionStorage.getItem("rxvff_lv_nonce");
    const startedAt = Number(localStorage.getItem("rxvff_lv_started") || "0");
    const ref = document.referrer.toLowerCase();

    if (returnedToken) {
      const elapsedSec = (Date.now() - startedAt) / 1000;
      const validReferrer = ref.includes("linkvertise.com") || ref.includes("link-to.net");
      if (!expectedNonce || returnedToken !== expectedNonce || elapsedSec < 4 || !validReferrer) {
        tripBypass("invalid token or referrer");
      } else {
        sessionStorage.removeItem("rxvff_lv_nonce");
        localStorage.removeItem("rxvff_lv_started");
        statusText.className = "status ok";
        statusText.textContent = "Checkpoint verified. Key: RXVFF-KEY-2026";
      }
    } else {
      const nonce = makeNonce();
      sessionStorage.setItem("rxvff_lv_nonce", nonce);
      lvBtn.href = LINKVERTISE_URL;
      statusText.className = "status";
      statusText.textContent = "Ready. Click to open Linkvertise.";
    }

    lvBtn.addEventListener("click", (e) => {
      if (tripped) {
        e.preventDefault();
        return;
      }
      if (!e.isTrusted) {
        e.preventDefault();
        tripBypass("untrusted click");
        return;
      }
      localStorage.setItem("rxvff_lv_started", String(Date.now()));
      statusText.className = "status ok";
      statusText.textContent = "Checkpoint started. Return after finishing Linkvertise.";
    });

    window.addEventListener("keydown", (e) => {
      if (
        e.key === "F12" ||
        (e.ctrlKey && e.shiftKey && ["I", "J", "C"].includes(e.key.toUpperCase())) ||
        (e.metaKey && e.altKey && ["I", "J", "C"].includes(e.key.toUpperCase()))
      ) {
        tripBypass("devtools shortcut");
      }
    });

    let lastSizeCheck = 0;
    setInterval(() => {
      if (tripped) return;
      const now = Date.now();
      if (now - lastSizeCheck < 1200) return;
      lastSizeCheck = now;
      const widthGap = window.outerWidth - window.innerWidth;
      const heightGap = window.outerHeight - window.innerHeight;
      if (widthGap > 180 || heightGap > 180) {
        tripBypass("docked inspector");
      }
    }, 1200);
  </script>
</body>
</html>
